services:
  github-discord-notifier:
    image: ghcr.io/aerya/github-discord-notifier:latest
    container_name: github-discord-notifier
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_SECRET_KEY: à générer avec python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      APP_ENCRYPTION_KEY: à générer avec python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    volumes:
      - ./data:/data
